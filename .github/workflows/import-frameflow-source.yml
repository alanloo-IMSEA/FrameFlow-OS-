name: Import FrameFlow source package

on:
  push:
    branches: [main]
    paths:
      - frameflow-v223-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Expand verified source tree
        run: |
          unzip -oq frameflow-v223-source.zip -d .
          rm -f frameflow-v223-source.zip FrameFlow-OS-v216-source.zip
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand FrameFlow OS v223 source"
          git push
